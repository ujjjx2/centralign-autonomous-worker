name: Autonomous Worker CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run live-server integration suite (HTML transport)
        env:
          EXECUTION_MODE: http
          MODEL_BACKEND: rules
        run: python -m pytest -q
