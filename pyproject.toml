[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centralign-autonomous-worker"
version = "6.2.0"
description = "Local Ollama Gemma 4 E2B computer-use agent with model-guided planning, observation and recovery"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "playwright>=1.42,<2",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9",
  "jinja2>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
centralign-worker = "app.main:run_server"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
